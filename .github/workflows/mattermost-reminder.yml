name: Mattermost Reminder Bot

on:
  workflow_dispatch:
    inputs:
      reminder_type:
        description: "scrum_prep | scrum | jira_morning | jira | jira_evening | gitlab_mr"
        required: true
        default: "scrum"
      channel_override:
        description: "테스트용 개인 채널 (@username 또는 channel_id). 비우면 기본 채널 사용"
        required: false
        default: ""
  repository_dispatch:
    types:
      - send_reminder
      - scrum_prep
      - scrum
      - jira
      - jira_morning
      - jira_evening
      - gitlab_mr

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          webhook_jira_scrum="${{ secrets.MATTERMOST_CHANNEL_JIRA_SCRUM }}"
          webhook_mr="${{ secrets.MATTERMOST_CHANNEL_MR }}"

          if [ -z "$webhook_jira_scrum" ]; then
            echo "Missing required secret: MATTERMOST_CHANNEL_JIRA_SCRUM"
            exit 1
          fi

          if [ -z "$webhook_mr" ]; then
            echo "Missing required secret: MATTERMOST_CHANNEL_MR"
            exit 1
          fi

      - name: Resolve reminder type
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            type="${{ github.event.inputs.reminder_type }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            action_type="${{ github.event.action }}"
            payload_type="${{ github.event.client_payload.reminder_type }}"
            if [ -n "$payload_type" ]; then
              type="$payload_type"
            else
              type="$action_type"
            fi
          else
            echo "Unsupported event: ${{ github.event_name }}"
            exit 1
          fi

          case "$type" in
            scrum_prep|scrum|jira_morning|jira|jira_evening|gitlab_mr) ;;
            *)
              echo "Unsupported reminder type: $type"
              exit 1
              ;;
          esac

          echo "type=$type" >> "$GITHUB_OUTPUT"

      - name: Decide delivery
        id: gate
        shell: bash
        run: |
          type="${{ steps.resolve.outputs.type }}"
          jira_enabled="${{ vars.ENABLE_JIRA_REMINDERS }}"
          send_enabled="true"

          if [ "$type" = "jira_morning" ] || [ "$type" = "jira" ] || [ "$type" = "jira_evening" ]; then
            if [ "$jira_enabled" != "true" ]; then
              send_enabled="false"
              echo "Skipping Jira reminder because ENABLE_JIRA_REMINDERS is not true"
            fi
          fi

          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "$type" = "gitlab_mr" ]; then
            action="${{ github.event.client_payload.action }}"
            case "$action" in
              open|opened|reopen|reopened) ;;
              *)
                send_enabled="false"
                echo "Skipping gitlab_mr for action: $action"
                ;;
            esac
          fi

          echo "send_enabled=$send_enabled" >> "$GITHUB_OUTPUT"

      - name: Resolve channel target
        id: target
        shell: bash
        run: |
          strict_channel_override="false"
          channel=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.channel_override }}" ]; then
            channel="${{ github.event.inputs.channel_override }}"
            strict_channel_override="true"
            echo "Using channel override for manual test run: $channel"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -n "${{ github.event.client_payload.channel_override }}" ]; then
            channel="${{ github.event.client_payload.channel_override }}"
            strict_channel_override="true"
            echo "Using channel override from repository_dispatch payload: $channel"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "strict_channel_override=$strict_channel_override" >> "$GITHUB_OUTPUT"

      - name: Resolve webhook target
        id: webhook
        shell: bash
        run: |
          type="${{ steps.resolve.outputs.type }}"
          webhook_jira_scrum="${{ secrets.MATTERMOST_CHANNEL_JIRA_SCRUM }}"
          webhook_mr="${{ secrets.MATTERMOST_CHANNEL_MR }}"

          if [ "$type" = "gitlab_mr" ]; then
            webhook_url="$webhook_mr"
          else
            webhook_url="$webhook_jira_scrum"
          fi

          if [ -z "$webhook_url" ]; then
            echo "Missing required webhook secret for reminder type: $type"
            exit 1
          fi

          echo "webhook_url=$webhook_url" >> "$GITHUB_OUTPUT"

      - name: Send to Mattermost
        if: steps.gate.outputs.send_enabled == 'true'
        run: python3 bot/reminder.py "${{ steps.resolve.outputs.type }}"
        env:
          MATTERMOST_WEBHOOK_URL: ${{ steps.webhook.outputs.webhook_url }}
          MATTERMOST_CHANNEL: ${{ steps.target.outputs.channel }}
          MATTERMOST_STRICT_CHANNEL_OVERRIDE: ${{ steps.target.outputs.strict_channel_override }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          GITLAB_MR_ACTION: ${{ github.event.client_payload.action }}
          GITLAB_PROJECT: ${{ github.event.client_payload.project }}
          GITLAB_MR_IID: ${{ github.event.client_payload.iid }}
          GITLAB_MR_TITLE: ${{ github.event.client_payload.title }}
          GITLAB_MR_URL: ${{ github.event.client_payload.url }}
          GITLAB_MR_ACTOR: ${{ github.event.client_payload.actor }}
          GITLAB_MR_AUTHOR: ${{ github.event.client_payload.author }}
